name: CI

on:
  push:
    branches: [main, "fix/**", "chore/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Type-check, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Type Check
        run: pnpm run type-check

      - name: Run Test Suite
        run: pnpm test

      - name: Run Production Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://askore.kr"
          TURSO_DATABASE_URL: "file:local.db"
