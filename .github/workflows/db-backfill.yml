name: db-backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드 (dry-run: 검사만 수행 / execute: 실제 DB 수정)"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - execute

jobs:
  backfill:
    name: Turso DB Timestamp & Safety Backfill (${{ inputs.mode }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB Backfill (${{ inputs.mode }})
        run: |
          if [ "${{ inputs.mode }}" = "execute" ]; then
            node scripts/backfill-timestamps-and-safety.mjs --execute
          else
            node scripts/backfill-timestamps-and-safety.mjs
          fi
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
