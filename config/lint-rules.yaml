banned_words:
  medical_claims:
    - "치료한다"
    - "낫는다"
    - "복용 권장"
    - "효능"
    - "약효"
    - "병이 낫"
  pet_medical_certainty:
    - "무조건 안전"
    - "절대 안전"
    - "먹어도 OK"
  unsupported_claims:
    - "연구 결과"
    - "전문가가"

ai_cliches_threshold:
  매혹적인: 1
  놀라운: 2
  주목할 만한: 1

required_persona_signals:
