  plant_personification_min_count: 1
  friendly_honorific_examples:
    - "예요"
    - "답니다"
  plant_personification_examples:
    - "이 친구"
    - "좋아해요"

required_fields:
  layer1:
    - scientificName
    - koreanName
    - slug
  layer2:
    - climateScoreByRegion
    - indoorOutdoorClass
  layer3:
    - summaryOneLiner
    - quickFactsJson
    - faqJson
